# Home Assistant package. Set Home Assistant timezone to Europe/Kyiv.
input_datetime:
  toe_morning_time:
    name: ТОЕ — час ранкового повідомлення
    has_date: false
    has_time: true
    initial: "09:00:00"

rest_command:
  toe_morning_graph:
    url: >-
      https://api-poweron.toe.com.ua/api/a_gpv_g?{{ {'after': (now().date() - timedelta(days=1)) ~ 'T12:00:00+00:00', 'before': (now().date() + timedelta(days=1)) ~ 'T00:00:00+00:00', 'group[]': group, 'time': address_key | replace('/', '')} | urlencode }}
    method: GET
    timeout: 20
    headers:
      Accept: application/json
      X-debug-key: "{{ address_key | base64_encode }}"

automation:
  - id: toe_morning_outages
    alias: ТОЕ — ранковий графік відключень
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.toe_morning_time
    variables:
      group: "__TOE_GROUP__"
      address_key: "__TOE_ADDRESS__"
      # Replace with notify.mobile_app_YOUR_PHONE for a phone push.
      notification_action: persistent_notification.create
    actions:
      - action: rest_command.toe_morning_graph
        data:
          group: "{{ group }}"
          address_key: "{{ address_key }}"
        response_variable: graph_response
        continue_on_error: true
      - variables:
          body: >-
            {% set response = graph_response | default({}) %}
            {% set content = response.get('content', {}) %}
            {{ content if content is mapping else content | from_json({}) }}
          today_times: >-
            {% set ns = namespace(records=[]) %}
            {% for record in body.get('hydra:member', []) if record is mapping %}
              {% if (record.get('dateGraph', '') | string)[:10] == now().date() | string %}
                {% set ns.records = ns.records + [record] %}
              {% endif %}
            {% endfor %}
            {% set records = ns.records | sort(attribute='dateCreate', reverse=true) %}
            {{ records[0].get('dataJson', {}).get(group, {}).get('times', {}) if records else {} }}
          outage_message: >-
            {% set ns = namespace(ranges=[], start=none, previous=none) %}
            {% for i in range(49) %}
              {% set key = '%02d:%02d' | format(i // 2, (i % 2) * 30) %}
              {% set status = today_times.get(key, '?') | string if i < 48 else '?' %}
              {% if status != ns.previous %}
                {% if ns.start is not none %}
                  {% set ns.ranges = ns.ranges + [ns.start ~ '–' ~ key ~ (' (можливе)' if ns.previous == '10' else '')] %}
                {% endif %}
                {% set ns.start = key if status in ['1', '10'] else none %}
                {% set ns.previous = status %}
              {% endif %}
            {% endfor %}
            {{ ns.ranges | join(', ') }}
      - choose:
          - conditions: >-
              {{ (graph_response | default({})).get('status') != 200 or today_times | length == 0 }}
            sequence:
              - action: "{{ notification_action }}"
                data:
                  title: ТОЕ — графік недоступний
                  message: Не вдалося отримати графік на сьогодні. Перевірте його пізніше; це не означає відсутність відключень.
          - conditions: "{{ outage_message | trim | length > 0 }}"
            sequence:
              - action: "{{ notification_action }}"
                data:
                  title: "ТОЕ — відключення сьогодні, черга {{ group }}"
                  message: >-
                    {{ outage_message }}. Час за Києвом. Це плановий графік, який може змінитися.
